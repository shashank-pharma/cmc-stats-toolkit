[project]
name = "cmc-stats-toolkit"
version = "0.9.0"
description = "ICH Q1E shelf-life, dissolution f2 and bioequivalence statistics (educational, not GxP-validated)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pandas>=2.2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "plotly>=5.22",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "pandas-stubs>=2.2",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmc_stats"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PT", "NPY"]
# Report unused imports but never auto-delete them: the edit hook runs between edits, so an
# import added just before the code that uses it would otherwise be removed.
unfixable = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cmc_stats"]

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "plotly.*", "reportlab.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
